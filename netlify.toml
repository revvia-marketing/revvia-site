# Netlify build config. The @astrojs/netlify adapter wires the SSR function
# (for /keystatic) and emits _redirects; this just pins the build + Node.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Catch-all for any other old Wix blog post. Netlify checks _redirects (the
# specific /post/... rules from astro.config.mjs) before these, so this only
# catches posts with no specific rule.
# Retired offers. force = true is Netlify's 301! so an existing file cannot win.
[[redirects]]
  from = "/ai-snapshot"
  to = "/ai-visibility"
  status = 301
  force = true

[[redirects]]
  from = "/ai-snapshot/"
  to = "/ai-visibility"
  status = 301
  force = true

[[redirects]]
  from = "/ai-snapshot/thanks"
  to = "/ai-visibility"
  status = 301
  force = true

[[redirects]]
  from = "/ai-snapshot/thanks/"
  to = "/ai-visibility"
  status = 301
  force = true

[[redirects]]
  from = "/answer-check"
  to = "/ai-visibility"
  status = 301
  force = true

[[redirects]]
  from = "/answer-check/"
  to = "/ai-visibility"
  status = 301
  force = true

# TODO(Tim): decide whether /services/geo-visibility-overhaul should 301 here.
# Left live on purpose. It still offers a GEO rebuild and overlaps this page.

[[redirects]]
  from = "/post/*"
  to = "/journal/"
  status = 301

# Security + caching niceties (optional, safe defaults)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
